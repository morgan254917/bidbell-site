name: Verify live BidBell website
on:
  workflow_dispatch:
    inputs:
      expected_mode:
        description: Expected public release mode
        type: choice
        options: [auto, baseline, expanded]
        default: auto
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install image verification dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/site-verify"
          "$RUNNER_TEMP/site-verify/bin/python" -m pip install --only-binary=:all: Pillow==13.0.0
      - name: Verify canonical HTTPS, current content and excluded paths
        env:
          BIDBELL_EXPECTED_SITE_MODE: ${{ inputs.expected_mode }}
        run: '"$RUNNER_TEMP/site-verify/bin/python" tools/check_live_site.py'
